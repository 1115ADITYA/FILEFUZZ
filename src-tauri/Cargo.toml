[package]
name = "offline-file-finder"
version = "0.1.0"
description = "Offline File Finder"
authors = ["Aditya"]
edition = "2021"

[lib]
name = "offline_file_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.12"
lopdf = "0.42"
tantivy = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
